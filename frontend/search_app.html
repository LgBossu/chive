<!DOCTYPE html>
<html>
<!-- This is the main page of the prototype interface. It serves as a placeholder
     and will be expanded with links to functional search pages and other features
     as the project develops. -->

<head>
    <meta charset="UTF-8" />
    <title>Search app interface</title>
    <link rel="icon" type="image/x-icon" href="assets/icons/applogo.ico" />
    <link rel="stylesheet" href="styles/style.css" />
</head>

<body>
    <div class="nav-bar">
        <button id="homeButton" class="nav-bar nav-button" onclick="window.location.href='index.html'">
            Home
        </button>
        <button id="databaseButton" class="nav-bar nav-button" onclick="window.location.href='update_database.html'">
            Database
        </button>
        <button id="appButton" class="nav-bar nav-button" onclick="window.location.href='search_app.html'" disabled
            style="border-top: 2px solid var(--accent)">
            Search app
        </button>
    </div>

    <div id="app-container">

        <div id="conversation-panel">
            <!-- Clickable tabs -- each button now has a data-tab attribute -->
            <div id="tabslist-container" class="tabs-container">
                <button id="welcomeTab" class="tab-link" data-tab="welcome">Welcome</button>
                <button id="defaultHelp" class="tab-link" data-tab="help">Help</button>
                <button id="creditsTab" class="tab-link" data-tab="credits">Credits</button>
                <!-- <button id="reallyLongTab" class="tab-link" data-tab="lorem">Really Long Tab filled with lorem ipsum
                    that will just tend to overflow the tabs bar for testing and tuning purposes</button> -->
            </div>
            <!-- Active conversation container -->
            <div class="active-tab-container" id="active-viewer">
                <!-- This content will be replaced by the selected tab conversation -->
            </div>
        </div>

        <div id="side-panel">
            <section id="search-database">
                <h2>Search Database</h2>
                <input type="text" placeholder="Semantic search" />
                <button>Filter by conv</button>
                <button>Filter by thread</button>
                <button>Filter by tone tag</button>
                <button>Etc...</button>
                <button>Send Request</button>
            </section>

            <section id="edit-metadata">
                <h2>Edit Special Metadata</h2>
                <textarea placeholder="Manual metadata entry or editing..."></textarea>
                <button>Update Metadata</button>
            </section>
        </div>

    </div>

    <!-- Include your scripts file -->
    <script src="scripts/scripts.js"></script>
</body>


</html>
